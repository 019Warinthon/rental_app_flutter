name: rental_app
description: "A premium rental application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.2.2
  dio: ^5.9.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - .env

